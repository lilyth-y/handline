<script defer src="/_vercel/insights/script.js"></script>
<noscript><meta http-equiv="refresh" content="0;url=/en/?t=star&amp;ref=share"></noscript>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#2a2f7a 0%,#0d1236 55%);color:#f4f1ff;font-family:-apple-system,"Noto Sans KR","Noto Sans JP","Noto Sans TC",sans-serif;text-align:center}
.wrap{max-width:420px;margin:0 auto;padding:22px 18px calc(36px + env(safe-area-inset-bottom))}
.card{border:1px solid #f3cc6b66;border-radius:18px;padding:22px 16px 18px;background:linear-gradient(160deg,#f3cc6b16,#b9a7ff14);cursor:pointer}
.eb{font-size:14px;font-weight:700;color:#f3cc6b;margin:0 0 8px}
.fox{font-size:28px;font-weight:900;margin:0 0 4px;line-height:1.3}
.lead{margin:0 0 10px;font-size:14px;line-height:1.65;color:#e6defc}
.sub{margin:0 0 12px;font-size:12px;line-height:1.5;color:#b7b3d6}
.q{margin:0 0 10px;font-size:16px;font-weight:700}
.stars{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:0 0 12px;text-align:left;font-size:12px;color:#e6defc}
.stars span b{color:#f3cc6b;letter-spacing:1px}
.pair{margin:0 0 12px;font-size:15px;color:#f3cc6b;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;color:#2a1d00;background:linear-gradient(90deg,#f3cc6b,#ffe6a6);cursor:pointer;text-decoration:none;box-shadow:0 8px 28px #f3cc6b44}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="sl-card" role="link" tabindex="0" aria-label="Find my fox &amp; compare ✨">
    <p class="eb">🤝 A friend shared their palm reading</p>
    <p class="fox">⭐ The Star Fox</p>
    <p class="lead">This is a friend's result—they got The Star Fox. Ready to see which fox is in your palm?</p>
    <p class="sub">One palm photo · analyzed only on your device</p>
    <p class="q">Which fox are you? 🦊</p>
    <div id="stars" class="stars" hidden></div>
    <p id="pair" class="pair" hidden></p>
    <button type="button" class="btn" id="sl-start">Find my fox &amp; compare ✨</button>
  </div>
</div>
<script>
// Chat crawlers read OG only. Humans see this landing, then tap through to the app with ref=share.
(function () {
  var HOME = "/en/";
  var TID = "star";
  var LANG = "en";
  var pairTpl = "They scored {score}% compatibility—I want to try mine too!";
  var luckLbl = {"wealth":"Wealth","love":"Love","health":"Health","career":"Career"};
  var LUCK_EMOJI = {wealth:'💰',love:'💕',health:'💪',career:'💼'};
  function appQS() {
    var p = new URLSearchParams(location.search);
    var q = new URLSearchParams();
    q.set('t', TID);
    if (/^[1-5]{4}$/.test(p.get('s') || '')) q.set('s', p.get('s'));
    if (/^[0-9a-z-]{14}$/.test(p.get('p') || '')) q.set('p', p.get('p'));
    if (/^[a-z]{3,12}$/.test(p.get('f') || '') && /^[0-9]{2,3}$/.test(p.get('c') || '')) { q.set('f', p.get('f')); q.set('c', p.get('c')); }
    q.set('ref', /^[a-z0-9_-]{1,20}$/i.test(p.get('ref') || '') ? p.get('ref') : 'share');
    return q;
  }
  function track(name, data) {
    try { if (typeof window.va === 'function') window.va('event', { name: name, data: Object.assign({ lang: LANG }, data || {}) }); } catch (e) {}
    try { (window.__track = window.__track || []).push({ name: name, data: data || {} }); } catch (e2) {}
  }
  function goApp() {
    track('share_landing_start', { t: TID });
    location.href = HOME + '?' + appQS().toString();
  }
  try {
    var pf = document.createElement('link');
    pf.rel = 'prefetch';
    pf.href = HOME + '?' + appQS().toString();
    document.head.appendChild(pf);
  } catch (ePf) {}
  var p = new URLSearchParams(location.search);
  var f = p.get('f'), c = p.get('c'), s = p.get('s');
  if (/^[1-5]{4}$/.test(s || '')) {
    var keys = ['wealth','love','health','career'];
    var box = document.getElementById('stars');
    box.innerHTML = keys.map(function (k, i) {
      var n = +s.charAt(i);
      return '<span>' + LUCK_EMOJI[k] + ' ' + luckLbl[k] + ' <b>' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</b></span>';
    }).join('');
    box.hidden = false;
  }
  if (/^[a-z]{3,12}$/.test(f || '') && /^[0-9]{2,3}$/.test(c || '')) {
    var el = document.getElementById('pair');
    el.textContent = pairTpl.replace('{score}', c);
    el.hidden = false;
  }
  track('share_landing_view', { t: TID, pair: !!f, stars: /^[1-5]{4}$/.test(s || '') });
  document.getElementById('sl-start').addEventListener('click', function (e) { e.stopPropagation(); goApp(); });
  document.getElementById('sl-card').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'sl-start') return;
    goApp();
  });
  document.getElementById('sl-card').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goApp(); }
  });
})();
</script>
</body>
</html>
